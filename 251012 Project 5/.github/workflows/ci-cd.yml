name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linting
      run: |
        pip install flake8 black isort
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check src/
        isort --check-only src/
    
    - name: Run unit tests
      run: |
        pip install pytest pytest-cov
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  data-validation:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run data validation
      run: |
        python -m src.data_validation.main
    
    - name: Run Great Expectations checkpoint
      run: |
        great_expectations checkpoint run data_quality_checkpoint

  training-test:
    runs-on: ubuntu-latest
    needs: [test, data-validation]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start MLflow server
      run: |
        mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000 &
        sleep 10
    
    - name: Run limited training test
      run: |
        export MLFLOW_TRACKING_URI=http://localhost:5000
        python -c "
        import sys
        sys.path.append('.')
        from src.train.main import MLTrainingPipeline
        import yaml
        
        # Modify config for quick test
        config = {
            'ingest': {'max_samples': 1000},
            'train': {
                'models': ['random_forest'],
                'optuna': {'n_trials': 5},
                'cv_folds': 3
            },
            'validation_size': 0.2,
            'test_size': 0.2
        }
        
        with open('test_params.yaml', 'w') as f:
            yaml.dump(config, f)
        
        pipeline = MLTrainingPipeline('test_params.yaml')
        results = pipeline.train_all_models()
        print('Training test completed successfully')
        "

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, data-validation, training-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add actual deployment commands here
        # docker build -t ml-app:staging .
        # docker push ml-app:staging
        # kubectl apply -f k8s/staging/
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        # Add smoke test commands here
        # curl -f http://staging-api.example.com/health
        # python tests/smoke_tests.py
