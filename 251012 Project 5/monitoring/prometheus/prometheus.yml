alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - localhost:9093
global:
  evaluation_interval: 15s
  scrape_interval: 15s
rule_files:
- rules/*.yml
scrape_configs:
- job_name: ml-api
  metrics_path: /metrics
  scrape_interval: 5s
  static_configs:
  - targets:
    - localhost:8000
- job_name: mlflow
  metrics_path: /metrics
  scrape_interval: 30s
  static_configs:
  - targets:
    - localhost:5000
