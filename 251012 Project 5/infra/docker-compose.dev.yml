version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mlflow:
    image: python:3.11-slim
    working_dir: /app
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:mlflow@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-bucket/artifacts
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    command: >
      sh -c "pip install mlflow psycopg2-binary boto3 &&
             mlflow server --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
             --default-artifact-root s3://mlflow-bucket/artifacts
             --host 0.0.0.0 --port 5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      MODEL_NAME: app_model
      MODEL_STAGE: Staging
    depends_on:
      mlflow:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn src.serve.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  minio_data:
