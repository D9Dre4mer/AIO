# MLflow Server Configuration

# Server Configuration
MLFLOW_HOST=0.0.0.0
MLFLOW_PORT=5000
MLFLOW_WORKERS=4
MLFLOW_TIMEOUT=120

# Database Configuration
# Option 1: SQLite (Default - for development)
MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db

# Option 2: PostgreSQL (Recommended for production)
# MLFLOW_BACKEND_STORE_URI=postgresql://username:password@localhost:5432/mlflow

# Option 3: MySQL
# MLFLOW_BACKEND_STORE_URI=mysql+pymysql://username:password@localhost:3306/mlflow

# Artifact Storage Configuration
# Option 1: Local filesystem (Default)
MLFLOW_ARTIFACT_ROOT=./mlruns

# Option 2: AWS S3
# MLFLOW_ARTIFACT_ROOT=s3://your-bucket-name/mlflow-artifacts

# Option 3: Azure Blob Storage
# MLFLOW_ARTIFACT_ROOT=wasbs://container@account.blob.core.windows.net/mlflow-artifacts

# Option 4: Google Cloud Storage
# MLFLOW_ARTIFACT_ROOT=gs://your-bucket-name/mlflow-artifacts

# Authentication Configuration (Optional)
# MLFLOW_AUTH_ENABLED=false
# MLFLOW_AUTH_USERNAME=admin
# MLFLOW_AUTH_PASSWORD=password

# Logging Configuration
LOG_LEVEL=INFO
LOG_FILE=logs/mlflow.log

# Monitoring Configuration
PROMETHEUS_ENABLED=true
PROMETHEUS_PORT=9090
