global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "mlflow_rules.yml"

scrape_configs:
  - job_name: 'mlflow-server'
    static_configs:
      - targets: ['mlflow-server:5000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
